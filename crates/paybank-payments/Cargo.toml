[package]
name = "paybank-payments"
version = "0.1.0"
edition = "2021"

[dependencies]
paybank-core = { path = "../paybank-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tracing = "0.1"