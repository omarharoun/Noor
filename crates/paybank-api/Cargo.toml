[package]
name = "paybank-api"
version = "0.1.0"
edition = "2021"

[dependencies]
paybank-core = { path = "../paybank-core" }
paybank-db = { path = "../paybank-db" }
paybank-payments = { path = "../paybank-payments" }
paybank-qr = { path = "../paybank-qr" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "fs", "cors"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
tracing = "0.1"