name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://noralpay:noralpay_dev_password@localhost:5432/noralpay

jobs:
  # ── Rust: fmt, clippy, migrate, sqlx-prepare check, build, test ──────────
  rust:
    name: Rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noralpay
          POSTGRES_DB: noralpay
          POSTGRES_PASSWORD: noralpay_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noralpay -d noralpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        run: cargo sqlx migrate run
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify sqlx offline cache is up to date
        run: cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: cargo build --release
        env:
          SQLX_OFFLINE: "true"

      - name: Test
        run: cargo test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ── Admin: Node 20, npm ci, build ────────────────────────────────────────
  admin:
    name: Admin (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Secret scan: gitleaks ─────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
