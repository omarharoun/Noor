services:
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: paybank-appsmith
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - APPSMITH_ENCRYPTION_PASSWORD=paybank_encryption_key_2026
      - APPSMITH_ENCRYPTION_SALT=paybank_encryption_salt_2026
      - APPSMITH_DISABLE_INTERCOM=1
    volumes:
      - appsmith-stacks:/appsmith-stacks
    restart: unless-stopped

volumes:
  appsmith-stacks:
