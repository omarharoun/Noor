<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noor — Merchant dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --clay:#C96442;--clay-50:#FBF3EE;--clay-600:#B5512F;--clay-700:#97421F;
  --brand:#C96442;--brand-soft:#FBF3EE;
  --cream:#FAF9F5;--cream-deep:#F4F2EA;--manilla:#EFEADC;--surface:#FFFFFF;--surface-2:#FCFBF8;
  --ink:#211F1A;--ink-2:#57534A;--ink-3:#8B857A;--ink-4:#B4AEA1;
  --border:#E9E5DA;--border-strong:#DBD6C8;--border-ink:#C9C3B4;
  --success:#3F6B34;--success-fill:#EAF1E1;--success-border:#CFE0BD;
  --warning:#98671B;--warning-fill:#F7ECD6;--warning-border:#ECD8AE;
  --info:#3E6486;--info-fill:#E5EDF3;--info-border:#C6D9E7;
  --danger:#A8412A;--danger-fill:#F6E1D9;--danger-border:#E8C4B5;
  --neutral:#5A5246;--neutral-fill:#EFEADD;--neutral-border:#DED6C5;
  --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
  --shadow-xs:0 1px 2px rgba(40,33,24,.05);--shadow-sm:0 1px 2px rgba(40,33,24,.04),0 2px 6px rgba(40,33,24,.05);--shadow-md:0 2px 4px rgba(40,33,24,.04),0 8px 20px rgba(40,33,24,.07);
  --ring:0 0 0 3px rgba(201,100,66,.18);
  --font-serif:'Newsreader',Georgia,serif;--font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.ic{display:inline-flex}.ic svg{display:block}
a{color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
.brand-row{display:flex;align-items:center;gap:10px;padding:6px 8px}
.brand-glyph{width:34px;height:34px;border-radius:10px;background:var(--clay);position:relative;flex:none}
.brand-name{font-family:var(--font-sans);font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand-plan{font-size:11px;color:var(--ink-3)}
.brand-divider{height:1px;background:var(--border);margin:14px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:.14s;border:none;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--cream-deep);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--ink);font-weight:600}
.nav-item.active .ic{color:var(--brand)}
.nav-item .ic{color:var(--ink-3)}
.sidebar-foot{margin-top:auto}
.foot-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:var(--r-md)}
.foot-user .nm{font-size:12.5px;font-weight:600;line-height:1.15}
.foot-user .em{font-size:11px;color:var(--ink-3)}
.avatar{border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1px solid var(--border);background:var(--cream);position:sticky;top:0;z-index:20}
.topbar h1{font-family:var(--font-serif);font-size:23px;font-weight:500;letter-spacing:-.01em}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--cream-deep)}
.content{padding:28px 30px;max-width:1160px;width:100%;margin:0 auto}
.intro{color:var(--ink-3);font-size:13.5px;margin:-2px 0 22px}
.section{display:none}.section.active{display:block}
/* buttons */
.mbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);font-weight:600;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;transition:.15s;line-height:1;white-space:nowrap}
.mbtn-md{font-size:13.5px;padding:9px 16px}.mbtn-sm{font-size:12.5px;padding:7px 12px}
.mbtn-primary{background:var(--brand);color:#fff}.mbtn-primary:hover{filter:brightness(1.07)}
.mbtn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}.mbtn-secondary:hover{background:var(--cream-deep)}
.mbtn-success{background:var(--success);color:#fff}
.mbtn-ghost{background:transparent;color:var(--ink-2)}.mbtn-ghost:hover{background:var(--cream-deep)}
.mbtn:disabled{opacity:.5;cursor:default}
.mbtn-pulse{animation:ctapulse 2s infinite}
@keyframes ctapulse{0%{box-shadow:0 0 0 0 rgba(63,107,52,.4)}70%{box-shadow:0 0 0 8px rgba(63,107,52,0)}100%{box-shadow:0 0 0 0 rgba(63,107,52,0)}}
/* badges */
.mbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.mbadge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tone-success{background:var(--success-fill);color:var(--success);border-color:var(--success-border)}
.tone-warning{background:var(--warning-fill);color:var(--warning);border-color:var(--warning-border)}
.tone-info{background:var(--info-fill);color:var(--info);border-color:var(--info-border)}
.tone-danger{background:var(--danger-fill);color:var(--danger);border-color:var(--danger-border)}
.tone-neutral{background:var(--neutral-fill);color:var(--neutral);border-color:var(--neutral-border)}
.rail-tag{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--cream-deep);border:1px solid var(--border);border-radius:var(--r-xs);padding:2px 7px}
.live-badge{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:11px;font-weight:600;color:var(--success);background:var(--success-fill);border-radius:var(--r-pill);padding:2px 9px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* cards */
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.mcard-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
.mcard-title{font-size:14.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center}
.mcard-body{padding:20px}
/* balance hero */
.balance-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.balance-card{background:var(--brand);border-radius:var(--r-lg);padding:24px;color:#fff;box-shadow:var(--shadow-sm)}
.balance-card .bk-label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.balance-card .bk-amount{font-family:var(--font-serif);font-size:44px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}
.balance-card .bk-row{display:flex;gap:26px;margin-top:18px}
.balance-card .bk-sub-l{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
.balance-card .bk-sub-v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.balance-card .bk-actions{display:flex;gap:8px;margin-top:22px}
.bk-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:var(--r-sm);cursor:pointer}
.bk-btn:hover{background:rgba(255,255,255,.26)}
.mini-stats{display:grid;grid-template-rows:1fr 1fr;gap:16px}
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px 18px;display:flex;align-items:center;gap:14px}
.mini-stat .ms-ico{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--brand-soft);flex:none}
.mini-stat .ms-label{font-size:11.5px;color:var(--ink-3);font-weight:500}
.mini-stat .ms-value{font-family:var(--font-serif);font-size:23px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* tables */
.tbl-wrap{width:100%;overflow-x:auto}
table.mtbl{width:100%;border-collapse:collapse;font-size:13px}
.mtbl th{text-align:left;padding:10px 18px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.mtbl td{padding:13px 18px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle}
.mtbl tbody tr:last-child td{border-bottom:none}
.mtbl tbody tr{transition:.1s}
.mtbl tbody tr:hover td{background:var(--cream)}
.mtbl tbody tr.sel td{background:var(--cream-deep)}
.cell-id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.cell-amt{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.cell-strong{font-weight:600;color:var(--ink)}
.cell-muted{color:var(--ink-3)}
.cell-name{display:flex;align-items:center;gap:10px}
/* filters */
.filterbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
/* forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:14px;font-family:var(--font-sans);color:var(--ink);background:var(--surface);transition:.15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--clay);box-shadow:var(--ring)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;gap:8px;margin-top:8px}
/* detail */
.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.dgrid{display:grid;grid-template-columns:auto 1fr;gap:11px 22px;align-items:center;font-size:13px}
.dgrid dt{color:var(--ink-3);font-weight:500}
.dgrid dd{color:var(--ink);margin:0}
.qr-well{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;display:grid;place-items:center;overflow:hidden}
.qr-well svg,.qr-well img{width:140px;height:140px}
.paylink{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:10px;word-break:break-all;text-align:center}
/* misc */
.flash{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;margin-bottom:14px}
.flash.success{background:var(--success-fill);color:var(--success);border:1px solid var(--success-border)}
.flash.info{background:var(--info-fill);color:var(--info);border:1px solid var(--info-border)}
.flash.error{background:var(--danger-fill);color:var(--danger);border:1px solid var(--danger-border)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border-strong);border-top-color:var(--clay);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
pre{background:var(--cream-deep);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;overflow:auto;font-size:12px;font-family:var(--font-mono);max-height:220px;margin:8px 0;color:var(--ink-2)}
@media(max-width:940px){.app{grid-template-columns:1fr}.sidebar{display:none}.balance-hero{grid-template-columns:1fr}.detail,.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" style="display:none">
  <aside class="sidebar">
    <div class="brand-row">
      <span class="brand-glyph"><svg viewBox="0 0 34 34" style="position:absolute;inset:0"><path d="M23 9.5a9 9 0 1 0 0 15 7 7 0 1 1 0-15Z" fill="var(--cream)"/></svg></span>
      <div><div class="brand-name">Noor</div><div class="brand-plan">Business</div></div>
    </div>
    <div class="brand-divider"></div>
    <button class="nav-item active" data-tab="overview"><i data-lucide="layout-dashboard"></i>Overview</button>
    <button class="nav-item" data-tab="payments"><i data-lucide="receipt"></i>Payments</button>
    <button class="nav-item" data-tab="invoices"><i data-lucide="file-text"></i>Invoices</button>
    <button class="nav-item" data-tab="create"><i data-lucide="plus-circle"></i>Payment link</button>
    <button class="nav-item" data-tab="bank"><i data-lucide="landmark"></i>Bank account</button>
    <div class="sidebar-foot">
      <div class="brand-divider"></div>
      <div class="foot-user"><span class="avatar" style="width:32px;height:32px;font-size:12px">M</span><div><div class="nm" id="foot-name">Merchant</div><div class="em">Business account</div></div></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Overview</h1>
      <div class="spacer"></div>
      <button class="mbtn mbtn-primary mbtn-sm" onclick="switchTab('create')"><i data-lucide="plus" style="width:14px;height:14px"></i>New payment link</button>
      <button class="icon-btn" title="Sign out" onclick="logout()"><i data-lucide="log-out" style="width:17px;height:17px"></i></button>
    </header>
    <div class="content">
      <p class="intro" id="page-intro">Your balance and recent payment activity.</p>
      <div id="section-overview" class="section active"></div>
      <div id="section-payments" class="section"></div>
      <div id="section-invoices" class="section"></div>
      <div id="section-create" class="section"></div>
      <div id="section-bank" class="section"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script>
/* Merchant dashboard — authenticates with a merchant API key (x-api-key) and
   talks ONLY to the merchant-scoped /api/merchant-api/* endpoints plus the
   public /api/banks and /api/sessions/:id/qr. Operator-only actions
   (initiate transfer, list all sessions) live in the operator console. */
const KEY_STORE = 'noor_merchant_key';
const DUMMY_ID = '00000000-0000-0000-0000-000000000000';
let API_KEY = localStorage.getItem(KEY_STORE) || '';
let MERCHANT_ID = null;

const TITLES = {
  overview: ['Overview', 'Your balance and recent payment activity.'],
  payments: ['Payments', 'Settled and in-flight payments on your account.'],
  invoices: ['Invoices', 'Send invoices and get paid by bank transfer.'],
  create:   ['Payment link', 'Create a hosted checkout link to collect a payment.'],
  bank:     ['Bank account', 'Your settlement bank account, verified securely.'],
};
const fmt = (c) => '$' + ((c||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const TONE = { settled:'success', completed:'success', processing:'info', pending:'warning', authorized:'neutral', failed:'danger', returned:'danger', reversed:'danger', expired:'danger' };
const badge = (s) => `<span class="mbadge tone-${TONE[s]||'neutral'}"><span class="mbadge-dot"></span>${s||'—'}</span>`;
const icons = () => { if (window.lucide) lucide.createIcons({ attrs:{'stroke-width':1.75} }); };

/* ---------- auth ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type':'application/json', 'x-api-key': API_KEY, ...(opts.headers||{}) }, ...opts });
  if (res.status === 401) { doLogout('Your API key was rejected — please sign in again.'); throw new Error('unauthorized'); }
  if (!res.ok) { const t = await res.text(); let m=t; try{const j=JSON.parse(t); m=j.error||j.message||t;}catch{} throw new Error(m); }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}
function doLogout(msg){ localStorage.removeItem(KEY_STORE); API_KEY=''; MERCHANT_ID=null; renderGate(msg); }
function logout(){ doLogout(); }

function renderGate(err){
  document.querySelector('.app').style.display='none';
  let g = document.getElementById('gate');
  if (!g){ g=document.createElement('div'); g.id='gate'; document.body.appendChild(g); }
  g.style.cssText='position:fixed;inset:0;display:grid;place-items:center;background:var(--cream);z-index:100;padding:20px';
  g.innerHTML = `<div style="width:100%;max-width:390px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:30px">
    <div style="display:flex;align-items:center;gap:10px"><span class="brand-glyph" style="width:30px;height:30px"><svg viewBox="0 0 34 34" style="position:absolute;inset:0"><path d="M23 9.5a9 9 0 1 0 0 15 7 7 0 1 1 0-15Z" fill="var(--cream)"/></svg></span><div class="brand-name" style="font-size:17px">Noor</div></div>
    <h2 style="font-family:var(--font-serif);font-weight:500;font-size:22px;margin:16px 0 4px">Merchant sign in</h2>
    <p style="color:var(--ink-3);font-size:13px;margin-bottom:18px">Enter your merchant API key to access your dashboard.</p>
    ${err?`<div class="flash error">${err}</div>`:''}
    <form id="gateForm"><div class="field"><label>API key</label><input id="gate-key" type="password" placeholder="pb_live_…" autocomplete="off"></div>
      <button class="mbtn mbtn-primary mbtn-md" type="submit" style="width:100%;justify-content:center">Sign in</button></form>
    <div id="gate-err" style="margin-top:12px"></div></div>`;
  icons();
  document.getElementById('gateForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const key = document.getElementById('gate-key').value.trim();
    if(!key) return;
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Signing in…';
    try{
      const res = await fetch('/api/merchant-api/balances/'+DUMMY_ID, { headers:{'x-api-key':key} });
      if(!res.ok) throw new Error('Invalid API key');
      const bal = await res.json();
      API_KEY = key; MERCHANT_ID = bal.merchant_id; localStorage.setItem(KEY_STORE, key);
      const g2=document.getElementById('gate'); if(g2) g2.remove();
      document.querySelector('.app').style.display='';
      boot();
    }catch(err){ document.getElementById('gate-err').innerHTML = `<div class="flash error">${err.message}</div>`; btn.disabled=false; btn.textContent='Sign in'; }
  });
  setTimeout(()=>document.getElementById('gate-key')?.focus(), 60);
}

/* ---------- nav ---------- */
document.querySelectorAll('.nav-item').forEach(a => a.addEventListener('click', () => {
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  const tab=a.dataset.tab;
  document.getElementById('section-'+tab).classList.add('active');
  const [t,i]=TITLES[tab]; document.getElementById('page-title').textContent=t; document.getElementById('page-intro').textContent=i;
  if(tab==='overview') loadOverview();
  if(tab==='payments') loadPayments();
  if(tab==='invoices') loadInvoices();
  if(tab==='create') renderCreate();
  if(tab==='bank') loadBank();
}));
function switchTab(name){ document.querySelector(`.nav-item[data-tab="${name}"]`)?.click(); }

/* ---------- overview ---------- */
async function loadOverview(){
  const el = document.getElementById('section-overview');
  el.innerHTML = `
    <div class="balance-hero">
      <div class="balance-card">
        <div class="bk-label">Available balance</div>
        <div class="bk-amount" id="ov-balance">—</div>
        <div class="bk-row">
          <div><div class="bk-sub-l">Pending</div><div class="bk-sub-v" id="ov-pending">—</div></div>
          <div><div class="bk-sub-l">Currency</div><div class="bk-sub-v">USD</div></div>
        </div>
        <div class="bk-actions">
          <button class="bk-btn" onclick="switchTab('create')"><i data-lucide="plus" style="width:14px;height:14px"></i>New payment link</button>
          <button class="bk-btn" onclick="switchTab('payments')"><i data-lucide="receipt" style="width:14px;height:14px"></i>Payments</button>
        </div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="ms-ico"><i data-lucide="check-circle-2" style="width:17px;height:17px;color:var(--brand)"></i></div><div><div class="ms-label">Payments</div><div class="ms-value" id="ov-count">0</div></div></div>
        <div class="mini-stat"><div class="ms-ico"><i data-lucide="landmark" style="width:17px;height:17px;color:var(--brand)"></i></div><div><div class="ms-label">Banks supported</div><div class="ms-value" id="ov-banks">0</div></div></div>
      </div>
    </div>
    <div class="mcard"><div class="mcard-head"><h2 class="mcard-title">Recent payments<span class="live-badge"><span class="live-dot"></span>Live</span></h2></div>
      <div id="ov-activity"><div class="empty"><div class="spinner"></div></div></div></div>`;
  icons();
  try{
    const [bal, pay, banks] = await Promise.all([
      api('/api/merchant-api/balances/'+(MERCHANT_ID||DUMMY_ID)),
      api('/api/merchant-api/payments?page=0&limit=8'),
      api('/api/banks'),
    ]);
    MERCHANT_ID = bal.merchant_id || MERCHANT_ID;
    document.getElementById('ov-balance').textContent = fmt(bal.available);
    document.getElementById('ov-pending').textContent = fmt(bal.pending);
    document.getElementById('ov-banks').textContent = (banks.banks||[]).length;
    const items = pay.payments || [];
    document.getElementById('ov-count').textContent = items.length;
    const act = document.getElementById('ov-activity');
    act.innerHTML = items.length ? renderPaymentsTable(items) : `<div class="empty">No payments yet. Create a payment link to start collecting.</div>`;
  }catch(e){ if(e.message!=='unauthorized') document.getElementById('ov-activity').innerHTML = `<div class="mcard-body"><div class="flash error">${e.message}</div></div>`; }
}

function renderPaymentsTable(items){
  return `<div class="tbl-wrap"><table class="mtbl"><thead><tr><th>Payment</th><th>Amount</th><th>Status</th><th>Method</th><th>Provider</th><th>Date</th></tr></thead><tbody>
    ${items.map(p=>`<tr>
      <td class="cell-id">${String(p.id||'').slice(0,8)}…</td>
      <td class="cell-amt">${fmt(p.amount)}</td>
      <td>${badge(p.status)}</td>
      <td><span class="rail-tag">${String(p.method||'—').toUpperCase()}</span></td>
      <td class="cell-muted">${p.provider||'—'}</td>
      <td class="cell-muted">${p.created_at?new Date(p.created_at).toLocaleDateString():'—'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* ---------- payments ---------- */
async function loadPayments(){
  const el = document.getElementById('section-payments');
  el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">Payments<span class="live-badge"><span class="live-dot"></span>Live</span></h2></div>
    <div id="pay-list"><div class="empty"><div class="spinner"></div></div></div></div>`;
  try{
    const data = await api('/api/merchant-api/payments?page=0&limit=100');
    const items = data.payments || [];
    document.getElementById('pay-list').innerHTML = items.length ? renderPaymentsTable(items) : `<div class="empty">No payments yet.</div>`;
  }catch(e){ if(e.message!=='unauthorized') document.getElementById('pay-list').innerHTML = `<div class="mcard-body"><div class="flash error">${e.message}</div></div>`; }
}

/* ---------- create payment link ---------- */
function renderCreate(){
  const el = document.getElementById('section-create');
  el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">New payment link</h2></div>
    <div class="mcard-body"><form id="createForm" style="max-width:520px">
      <div class="form-row">
        <div class="field"><label>Amount (USD)</label><input id="c-amount" value="10.00" inputmode="decimal"></div>
        <div class="field"><label>Currency</label><input id="c-currency" value="USD"></div>
      </div>
      <div class="field"><label>Description</label><input id="c-note" placeholder="Optional — shown to the customer"></div>
      <div class="form-actions"><button class="mbtn mbtn-primary mbtn-md" type="submit"><i data-lucide="plus" style="width:15px;height:15px"></i>Create link</button></div>
    </form><div id="create-result"></div></div></div>`;
  icons();
  document.getElementById('createForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.innerHTML='<span class="spinner" style="width:15px;height:15px;border-width:2px"></span> Creating…';
    const res = document.getElementById('create-result');
    try{
      const cents = Math.round(parseFloat(document.getElementById('c-amount').value) * 100);
      if(!cents || cents<1) throw new Error('Enter a valid amount.');
      const out = await api('/api/merchant-api/payment_links', { method:'POST', body: JSON.stringify({
        amount: cents,
        currency: document.getElementById('c-currency').value || 'USD',
        description: document.getElementById('c-note').value || null,
        checkout_host: window.location.origin,
      })});
      const url = out.checkout_url || (window.location.origin + '/pay/' + out.id);
      res.innerHTML = `<div class="flash success" style="margin-top:16px">Payment link created · ${fmt(cents)}</div>
        <div style="display:flex;gap:24px;align-items:flex-start;margin-top:12px;flex-wrap:wrap">
          <div class="qr-well" id="qrcode-new"><div class="spinner"></div></div>
          <div><p style="font-size:13px;color:var(--ink-2)">Share this link with your customer:</p>
          <p class="paylink" style="text-align:left">${url}</p>
          <div class="form-actions" style="margin-top:12px">
            <a class="mbtn mbtn-secondary mbtn-sm" href="${url}" target="_blank"><i data-lucide="external-link" style="width:14px;height:14px"></i>Open checkout</a>
            <button class="mbtn mbtn-secondary mbtn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}')"><i data-lucide="copy" style="width:14px;height:14px"></i>Copy link</button>
            <button class="mbtn mbtn-secondary mbtn-sm" onclick="switchTab('payments')">View payments</button>
          </div></div>
        </div>`;
      icons();
      fetch('/api/sessions/'+out.id+'/qr').then(r=>r.text()).then(svg=>{const q=document.getElementById('qrcode-new');if(q)q.innerHTML=svg;}).catch(()=>{});
    }catch(e){ if(e.message!=='unauthorized') res.innerHTML = `<div class="flash error" style="margin-top:16px">${e.message}</div>`; }
    btn.disabled=false; btn.innerHTML='<i data-lucide="plus" style="width:15px;height:15px"></i>Create link'; icons();
  });
}

/* ---------- invoices ---------- */
const INV_TONE = { paid:'success', unpaid:'warning', draft:'neutral', payment_pending:'info', voided:'danger', overdue:'danger' };
async function loadInvoices(){
  const el = document.getElementById('section-invoices');
  el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">Invoices</h2>
      <button class="mbtn mbtn-primary mbtn-sm" onclick="renderInvoiceForm()"><i data-lucide="plus" style="width:14px;height:14px"></i>New invoice</button></div>
    <div id="inv-list"><div class="empty"><div class="spinner"></div></div></div></div>
    <div id="inv-form"></div>`;
  icons();
  try{
    const data = await api('/api/merchant-api/invoices');
    const items = data.invoices || [];
    const list = document.getElementById('inv-list');
    if(!items.length){ list.innerHTML = `<div class="empty">No invoices yet. Create one to bill a customer.</div>`; return; }
    list.innerHTML = `<div class="tbl-wrap"><table class="mtbl"><thead><tr><th>Invoice</th><th>Customer</th><th>Amount</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>
      ${items.map(i=>`<tr>
        <td class="cell-id">${i.number||String(i.id).slice(0,8)}</td>
        <td>${i.customer_name||'—'}<div class="cell-muted" style="font-size:11px">${i.customer_email||''}</div></td>
        <td class="cell-amt">${fmt(i.amount)}</td>
        <td><span class="mbadge tone-${INV_TONE[i.status]||'neutral'}"><span class="mbadge-dot"></span>${i.status||'—'}</span></td>
        <td class="cell-muted">${i.created_at?new Date(i.created_at).toLocaleDateString():'—'}</td>
        <td>${i.hosted_url?`<a class="mbtn mbtn-secondary mbtn-sm" href="${i.hosted_url}" target="_blank"><i data-lucide="external-link" style="width:13px;height:13px"></i>Open</a>`:''}</td>
      </tr>`).join('')}</tbody></table></div>`;
    icons();
  }catch(e){ if(e.message!=='unauthorized') document.getElementById('inv-list').innerHTML=`<div class="mcard-body"><div class="flash error">${e.message}</div></div>`; }
}
function renderInvoiceForm(){
  const el = document.getElementById('inv-form');
  el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">New invoice</h2></div>
    <div class="mcard-body"><form id="invForm" style="max-width:560px">
      <div class="form-row">
        <div class="field"><label>Customer name</label><input id="i-name" placeholder="Acme Inc"></div>
        <div class="field"><label>Customer email</label><input id="i-email" type="email" placeholder="billing@acme.com"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Amount (USD)</label><input id="i-amount" value="100.00" inputmode="decimal"></div>
        <div class="field"><label>Due date</label><input id="i-due" type="date"></div>
      </div>
      <div class="field"><label>Description</label><input id="i-desc" placeholder="What is this invoice for?"></div>
      <div class="form-actions"><button class="mbtn mbtn-primary mbtn-md" type="submit"><i data-lucide="send" style="width:15px;height:15px"></i>Create & send</button></div>
    </form><div id="inv-result"></div></div></div>`;
  icons();
  document.getElementById('invForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.innerHTML='<span class="spinner" style="width:15px;height:15px;border-width:2px"></span> Creating…';
    const res=document.getElementById('inv-result');
    try{
      const cents = Math.round(parseFloat(document.getElementById('i-amount').value)*100);
      if(!cents||cents<1) throw new Error('Enter a valid amount.');
      const out = await api('/api/merchant-api/invoices', { method:'POST', body: JSON.stringify({
        customer_name: document.getElementById('i-name').value.trim(),
        customer_email: document.getElementById('i-email').value.trim(),
        amount: cents,
        description: document.getElementById('i-desc').value || null,
        due_date: document.getElementById('i-due').value || null,
      })});
      res.innerHTML = `<div class="flash success" style="margin-top:14px">Invoice ${out.number||''} created · ${fmt(out.amount)} · ${out.status}</div>
        ${out.hosted_url?`<p class="paylink" style="text-align:left">${out.hosted_url}</p>
        <div class="form-actions"><a class="mbtn mbtn-secondary mbtn-sm" href="${out.hosted_url}" target="_blank"><i data-lucide="external-link" style="width:14px;height:14px"></i>Open invoice</a>
        <button class="mbtn mbtn-secondary mbtn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${out.hosted_url}')"><i data-lucide="copy" style="width:14px;height:14px"></i>Copy link</button></div>`:''}`;
      icons(); loadInvoices();
    }catch(e){ if(e.message!=='unauthorized') res.innerHTML=`<div class="flash error" style="margin-top:14px">${e.message}</div>`; }
    btn.disabled=false; btn.innerHTML='<i data-lucide="send" style="width:15px;height:15px"></i>Create & send'; icons();
  });
}

/* ---------- bank account ---------- */
const BANK_TONE = { verified:'success', pending_verification:'info', unverified:'warning', denied:'danger', none:'neutral' };
const BANK_LABEL = { verified:'Verified', pending_verification:'Verifying (prenote sent)', unverified:'Unverified', denied:'Denied', none:'Not set' };
async function loadBank(){
  const el = document.getElementById('section-bank');
  el.innerHTML = `<div class="mcard"><div class="mcard-body"><div class="empty"><div class="spinner"></div></div></div></div>`;
  try{
    const b = await api('/api/merchant-api/bank-account');
    if (b.has_account){
      const st = b.status || 'unverified';
      el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">Settlement bank account</h2>${badgeBank(st)}</div>
        <div class="mcard-body">
          <dl class="dgrid" style="max-width:420px">
            <dt>Account</dt><dd>•••• ${b.last4||'????'}</dd>
            <dt>Status</dt><dd>${BANK_LABEL[st]||st}</dd>
            <dt>Verification</dt><dd>ACH bank verification</dd>
          </dl>
          ${st==='pending_verification'?`<div class="flash info" style="margin-top:16px">A $0 prenote was sent to confirm the account. This clears in 1–3 business days; the status updates automatically.</div>`:''}
          ${st==='verified'?`<div class="flash success" style="margin-top:16px">This account is verified and ready to receive settlements.</div>`:''}
          <div class="form-actions" style="margin-top:16px"><button class="mbtn mbtn-secondary mbtn-sm" onclick="renderBankForm()"><i data-lucide="repeat" style="width:14px;height:14px"></i>Replace account</button></div>
        </div></div>`;
      icons();
    } else {
      renderBankForm();
    }
  }catch(e){ if(e.message!=='unauthorized') el.innerHTML=`<div class="mcard"><div class="mcard-body"><div class="flash error">${e.message}</div></div></div>`; }
}
function badgeBank(s){ return `<span class="mbadge tone-${BANK_TONE[s]||'neutral'}"><span class="mbadge-dot"></span>${BANK_LABEL[s]||s}</span>`; }
function renderBankForm(){
  const el = document.getElementById('section-bank');
  el.innerHTML = `<div class="mcard"><div class="mcard-head"><h2 class="mcard-title">Add bank account</h2></div>
    <div class="mcard-body"><form id="bankForm" style="max-width:520px">
      <div class="field"><label>Account holder name</label><input id="b-holder" placeholder="Acme LLC"></div>
      <div class="form-row">
        <div class="field"><label>Account type</label><select id="b-type"><option value="checking">Checking</option><option value="savings">Savings</option></select></div>
        <div class="field"><label>Routing number (9 digits)</label><input id="b-routing" inputmode="numeric" placeholder="021000021"></div>
      </div>
      <div class="field"><label>Account number</label><input id="b-account" inputmode="numeric" placeholder="123456789"></div>
      <div class="flash info">Your bank details are sent securely to our banking partner to verify the account. Noor stores only the last 4 digits.</div>
      <div class="form-actions"><button class="mbtn mbtn-primary mbtn-md" type="submit"><i data-lucide="landmark" style="width:15px;height:15px"></i>Add & verify</button></div>
    </form><div id="bank-result"></div></div></div>`;
  icons();
  document.getElementById('bankForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.innerHTML='<span class="spinner" style="width:15px;height:15px;border-width:2px"></span> Submitting…';
    const res=document.getElementById('bank-result');
    try{
      await api('/api/merchant-api/bank-account', { method:'POST', body: JSON.stringify({
        account_holder_name: document.getElementById('b-holder').value.trim(),
        account_type: document.getElementById('b-type').value,
        routing_number: document.getElementById('b-routing').value.trim(),
        account_number: document.getElementById('b-account').value.trim(),
      })});
      loadBank();
    }catch(e){ if(e.message!=='unauthorized') res.innerHTML=`<div class="flash error" style="margin-top:14px">${e.message}</div>`; btn.disabled=false; btn.innerHTML='<i data-lucide="landmark" style="width:15px;height:15px"></i>Add & verify'; icons(); }
  });
}

/* ---------- boot ---------- */
function boot(){
  document.getElementById('foot-name').textContent = MERCHANT_ID ? ('Merchant ' + String(MERCHANT_ID).slice(0,8)) : 'Merchant';
  loadOverview();
  icons();
}
if (API_KEY){
  fetch('/api/merchant-api/balances/'+DUMMY_ID, { headers:{'x-api-key':API_KEY} })
    .then(r=>{ if(!r.ok) throw new Error('bad key'); return r.json(); })
    .then(b=>{ MERCHANT_ID=b.merchant_id; document.querySelector('.app').style.display=''; boot(); })
    .catch(()=> renderGate());
} else {
  renderGate();
}
</script>
