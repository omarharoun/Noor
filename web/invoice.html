<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depost — Receipt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --clay:#C96442;--clay-600:#B5512F;--clay-700:#97421F;
  --cream:#FAF9F5;--cream-deep:#F4F2EA;--manilla:#EFEADC;--surface:#FFFFFF;
  --ink:#211F1A;--ink-2:#57534A;--ink-3:#8B857A;--ink-4:#B4AEA1;
  --border:#E9E5DA;--border-strong:#DBD6C8;
  --success:#3F6B34;--success-fill:#EAF1E1;--success-border:#CFE0BD;
  --warning:#98671B;--warning-fill:#F7ECD6;--warning-border:#ECD8AE;
  --info:#3E6486;--info-fill:#E5EDF3;--info-border:#C6D9E7;
  --danger:#A8412A;--danger-fill:#F6E1D9;--danger-border:#E8C4B5;
  --neutral:#5A5246;--neutral-fill:#EFEADD;--neutral-border:#DED6C5;
  --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
  --shadow-xs:0 1px 2px rgba(40,33,24,.05);--shadow-md:0 2px 4px rgba(40,33,24,.04),0 8px 20px rgba(40,33,24,.07);
  --font-serif:'Newsreader',Georgia,serif;--font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream-deep);color:var(--ink);-webkit-font-smoothing:antialiased;padding:44px 20px;min-height:100vh}
.ic{display:inline-flex}.ic svg{display:block}
.container{max-width:720px;margin:0 auto}
.invoice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-md);overflow:hidden}
.inv-head{display:flex;align-items:flex-start;justify-content:space-between;padding:30px 34px;border-bottom:1px solid var(--border)}
.inv-head h1{font-family:var(--font-serif);font-size:28px;font-weight:500}
.inv-glyph{width:32px;height:32px;border-radius:9px;background:var(--clay);position:relative;flex:none}
.inv-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.inv-brand span{font-family:var(--font-sans);font-weight:700;font-size:17px}
.inv-head .meta{text-align:right;font-size:12.5px;color:var(--ink-3)}
.inv-body{padding:28px 34px 32px}
.inv-amount{font-family:var(--font-serif);font-size:40px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.inv-amount small{font-size:16px;color:var(--ink-3);font-weight:400}
.inv-section{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.inv-grid.c3{grid-template-columns:1fr 1fr 1fr}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-4);margin-bottom:3px}
.fld .v{font-size:14px;font-weight:500;color:var(--ink)}
.fld .v.mono{font-family:var(--font-mono);font-size:12.5px;font-weight:400}
.rail-tag{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-2);background:var(--cream-deep);border:1px solid var(--border);border-radius:var(--r-xs);padding:3px 8px}
.nbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;border:1px solid transparent}
.nbadge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tone-success{background:var(--success-fill);color:var(--success);border-color:var(--success-border)}
.tone-warning{background:var(--warning-fill);color:var(--warning);border-color:var(--warning-border)}
.tone-info{background:var(--info-fill);color:var(--info);border-color:var(--info-border)}
.tone-danger{background:var(--danger-fill);color:var(--danger);border-color:var(--danger-border)}
.tone-neutral{background:var(--neutral-fill);color:var(--neutral);border-color:var(--neutral-border)}
.mt-box{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:4px 16px}
.mt-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:16px}
.mt-row:last-child{border-bottom:none}
.mt-row .k{color:var(--ink-3)}
.mt-row .v{color:var(--ink);font-family:var(--font-mono);font-size:12px;text-align:right;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th{text-align:left;padding:7px 8px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border)}
.inv-actions{display:flex;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;font-family:var(--font-sans);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:.15s}
.btn.primary{background:var(--clay);color:#fff}
.btn.primary:hover{background:var(--clay-600)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.secondary:hover{background:var(--manilla)}
.powered{display:flex;align-items:center;gap:6px;margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-4)}
.powered strong{color:var(--ink-2);font-weight:600}
.loading{text-align:center;padding:64px 20px;color:var(--ink-3)}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border-strong);border-top-color:var(--clay);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.flash.error{color:var(--danger);background:var(--danger-fill);border:1px solid var(--danger-border);padding:12px;border-radius:var(--r-md);font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="loading" id="loading"><div class="spinner"></div><p>Loading receipt…</p></div>
  <div class="invoice" id="invoice" style="display:none"></div>
</div>

<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script>
const SESSION_ID = '__SESSION_ID__';
const TONE = { pending:'warning', authorized:'info', processing:'info', completed:'success', expired:'danger', returned:'danger', failed:'danger' };
const LABEL = { pending:'Pending', authorized:'Authorized', processing:'Processing', completed:'Completed', expired:'Expired' };
const fmt = (c) => '$' + (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const badge = (status) => `<span class="nbadge tone-${TONE[status]||'neutral'}"><span class="nbadge-dot"></span>${(LABEL[status]||status||'').replace(/^\w/,c=>c.toUpperCase())}</span>`;

async function load() {
  try {
    const s = await (await fetch('/api/sessions/' + SESSION_ID)).json();

    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('invoice');
    el.style.display = 'block';
    const cp = (s.column_counterparty_id || '').split('|');

    el.innerHTML = `
      <div class="inv-head">
        <div>
          <div class="inv-brand">
            <span class="inv-glyph"><svg viewBox="0 0 32 32" style="position:absolute;inset:0"><path d="M22 9a8.6 8.6 0 1 0 0 14 6.8 6.8 0 1 1 0-14Z" fill="var(--cream)"/></svg></span>
            <span>Depost</span>
          </div>
          <h1>Receipt</h1>
          <div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">Session ${s.id.slice(0,8)}…</div>
        </div>
        <div class="meta">
          <div>${new Date(s.created_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
          <div style="margin-top:6px">${badge(s.status)}</div>
        </div>
      </div>
      <div class="inv-body">
        <div class="inv-amount">${fmt(s.amount_cents)} <small>${s.currency}</small></div>

        <div class="inv-section">Payment details</div>
        <div class="inv-grid">
          <div class="fld"><label>Rail</label><div class="v"><span class="rail-tag">${(s.rail_used||'—').toUpperCase()}</span></div></div>
          <div class="fld"><label>Bank</label><div class="v">${s.bank_id}</div></div>
          <div class="fld"><label>Note</label><div class="v">${s.note || '—'}</div></div>
          <div class="fld"><label>Expires</label><div class="v">${new Date(s.expires_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></div>
        </div>

        ${s.customer_name ? `
        <div class="inv-section">Customer</div>
        <div class="inv-grid c3">
          <div class="fld"><label>Name</label><div class="v">${s.customer_name}</div></div>
          <div class="fld"><label>Email</label><div class="v">${s.customer_email_masked || '—'}</div></div>
          <div class="fld"><label>Phone</label><div class="v">${s.customer_phone_last4 || '—'}</div></div>
        </div>
        <div class="inv-grid" style="margin-top:16px">
          <div class="fld"><label>Location</label><div class="v">${[s.customer_address_city, s.customer_address_state, s.customer_address_country_code].filter(Boolean).join(', ') || '—'}</div></div>
        </div>` : ''}

        ${s.bank_linked ? `
        <div class="inv-section">Bank account</div>
        <div class="inv-grid c3">
          <div class="fld"><label>Account</label><div class="v mono">${s.customer_account_last4 ? '••••' + s.customer_account_last4 : '••••'}</div></div>
          <div class="fld"><label>Type</label><div class="v">${s.customer_account_type || '—'}</div></div>
          <div class="fld"><label>Status</label><div class="v">Linked</div></div>
        </div>` : ''}

        <div class="inv-actions">
          <a class="btn secondary" href="/pay/${SESSION_ID}"><i data-lucide="qr-code" style="width:15px;height:15px"></i>Pay page</a>
        </div>

        <div class="powered">
          <span class="ic" style="width:14px;height:14px"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="var(--clay)"/><path d="M12 4.4a5.6 5.6 0 1 0 0 9.2 4.4 4.4 0 1 1 0-9.2Z" fill="var(--cream)"/></svg></span>
          Powered by <strong>Depost</strong>
        </div>
      </div>
    `;
    if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="flash error">Failed to load receipt: ' + e.message + '</div>';
  }
}

if (SESSION_ID) load();
</script>
</body>
</html>
