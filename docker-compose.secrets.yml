# Production-style secrets overlay — Docker / Swarm file-backed secrets.
#
# Instead of injecting secrets through the environment (where they show up in
# `docker inspect` and `/proc/<pid>/environ`), each secret is mounted as a file
# under /run/secrets/<name>. The app reads `FOO` from the file named by
# `FOO_FILE` (see crates/paybank-api/src/secrets.rs).
#
#   Usage (compose, file-based secrets):
#     1. mkdir -p secrets && cd secrets
#     2. printf '%s' "$(openssl rand -base64 32)" > pii_key      # 32-byte PII key
#        printf '%s' "<neon-direct-url>"          > database_url
#        printf '%s' "$(openssl rand -hex 32)"     > jwt_secret
#        printf '%s' "<mt-api-key>"                > mt_api_key
#        printf '%s' "<mt-webhook-secret>"         > webhook_secret
#        # ...one file per secret; these files are gitignored.
#     3. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up
#
#   In Swarm, replace the `file:` sources with `external: true` and create them
#   via `docker secret create pii_key -`.
#
# This is the Level-1 "use a secrets manager" step from docs/KEY_MANAGEMENT.md,
# done the Docker-native way — no code change, no cloud SDK.

services:
  api:
    # Drop the plaintext env_file; secrets now arrive as files. Non-secret
    # config still comes from the environment.
    env_file: []
    environment:
      BIND_ADDR: "0.0.0.0:8888"
      NOOR_ENV: "production"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      PLAID_ENV: "${PLAID_ENV}"
      MODERN_TREASURY_ORG_ID: "${MODERN_TREASURY_ORG_ID}"
      MT_INTERNAL_ACCOUNT_ID: "${MT_INTERNAL_ACCOUNT_ID}"
      COLUMN_MERCHANT_ACCOUNT_ID: "${COLUMN_MERCHANT_ACCOUNT_ID}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      # File-backed secrets: each *_FILE points at a mounted secret.
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_key
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      MODERN_TREASURY_API_KEY_FILE: /run/secrets/mt_api_key
      COLUMN_API_KEY_FILE: /run/secrets/column_api_key
      PLAID_SECRET_FILE: /run/secrets/plaid_secret
    secrets:
      - pii_key
      - database_url
      - jwt_secret
      - webhook_secret
      - mt_api_key
      - column_api_key
      - plaid_secret

secrets:
  pii_key:        { file: ./secrets/pii_key }
  database_url:   { file: ./secrets/database_url }
  jwt_secret:     { file: ./secrets/jwt_secret }
  webhook_secret: { file: ./secrets/webhook_secret }
  mt_api_key:     { file: ./secrets/mt_api_key }
  column_api_key: { file: ./secrets/column_api_key }
  plaid_secret:   { file: ./secrets/plaid_secret }
